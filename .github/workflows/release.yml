# Instaladores do Ouver Estúdio para Windows, macOS e Linux.
#
# - Em pull requests: testa e gera os instaladores como artefatos (sem publicar),
#   para uma falha de empacotamento aparecer antes da release.
# - Numa tag v* (ex.: v0.1.0): testa, gera os instaladores nas três plataformas
#   e publica uma release no GitHub com eles anexados.
# - "Run workflow" manual: gera os instaladores como artefatos, sem publicar.
#
# Os instaladores NÃO são assinados (ainda): o macOS e o Windows avisam na
# primeira abertura. O ffmpeg (GPL) vai embutido; seu código-fonte é anexado à release.
# O whisper-cli (whisper.cpp, MIT) é compilado aqui, do código oficial na tag fixada
# em desktop/whisper-embutido.json; os modelos são baixados pelo app, sob demanda.
name: Instaladores

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg e OpenTimelineIO (para os testes de mídia e de exportação)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install opentimelineio otio-fcp-adapter otio-fcpx-xml-adapter
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  instaladores:
    needs: testes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: vendor/cache
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('desktop/ffmpeg-embutido.json') }}
      - name: Baixar e conferir o ffmpeg embutido (SHA-256 fixo)
        run: npm run ffmpeg:baixar
      - uses: actions/cache@v4
        id: cache-whisper
        with:
          path: vendor/whisper
          key: whisper-${{ runner.os }}-${{ hashFiles('desktop/whisper-embutido.json', 'scripts/compilar-whisper.mjs') }}
      - name: Compilar o whisper-cli embutido (whisper.cpp na tag fixada)
        if: steps.cache-whisper.outputs.cache-hit != 'true'
        run: npm run whisper:compilar
      - name: Gerar instaladores
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Executar o ffmpeg embutido no app empacotado
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   npm run ffmpeg:verificar -- release/linux-unpacked/resources/ffmpeg ;;
            Windows) npm run ffmpeg:verificar -- release/win-unpacked/resources/ffmpeg ;;
            macOS)
              npm run ffmpeg:verificar -- "release/mac-arm64/Ouver Estúdio.app/Contents/Resources/ffmpeg"
              npm run ffmpeg:verificar -- "release/mac/Ouver Estúdio.app/Contents/Resources/ffmpeg" --opcional ;;
          esac
      - name: Executar o whisper-cli embutido no app empacotado
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   npm run whisper:verificar -- release/linux-unpacked/resources/whisper ;;
            Windows) npm run whisper:verificar -- release/win-unpacked/resources/whisper ;;
            macOS)
              npm run whisper:verificar -- "release/mac-arm64/Ouver Estúdio.app/Contents/Resources/whisper"
              npm run whisper:verificar -- "release/mac/Ouver Estúdio.app/Contents/Resources/whisper" --opcional ;;
          esac
      - name: Transcrever de verdade com o whisper-cli embutido (Linux, modelo tiny)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
          espeak-ng -v pt-br -s 140 -w fala.wav "Bom dia. O trem das sete chegou atrasado hoje, por causa da chuva."
          ffmpeg -loglevel error -y -i fala.wav -ac 1 -ar 16000 -c:a pcm_s16le fala16.wav
          curl -fsSL --retry 4 -o ggml-tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          echo "be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21  ggml-tiny.bin" | sha256sum -c
          export OUVER_WHISPER_SAIDA="$PWD/whisper-saida.json"
          npm run whisper:verificar -- release/linux-unpacked/resources/whisper --transcrever fala16.wav ggml-tiny.bin
          npx vitest run test/whisperReal.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          # latest*.yml e .blockmap: o que o atualizador automático lê (versão, SHA-512, download parcial)
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error

  # Uma só release, criada depois que as três plataformas terminaram (publicar de
  # cada job em paralelo pode criar releases duplicadas).
  release:
    needs: instaladores
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - name: Código-fonte do FFmpeg embutido (obrigação da GPL)
        run: |
          versao=$(node -p "require('./desktop/ffmpeg-embutido.json').versao")
          curl -fsSL --retry 4 -o "instaladores/ffmpeg-$versao.tar.xz" "$(node -p "require('./desktop/ffmpeg-embutido.json').codigoFonte")"
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la instaladores
          # A release pode já existir (criada pela interface do GitHub, que também cria a
          # tag): nesse caso só anexa os instaladores.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" instaladores/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" instaladores/* \
              --title "Ouver Estúdio $GITHUB_REF_NAME" \
              --notes-file docs/release-notas.md
          fi
